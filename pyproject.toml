[project]
name = "bez"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hypernetx>=2.4.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "onnx>=1.18.0",
    "onnxruntime>=1.22.1",
    "pillow>=11.2.1",
    "scikit-image>=0.25.2",
    "scipy>=1.15.2",
    "skan>=0.12.2",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
cli = "bez:cli"


[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ty>=0.0.1a16",
    "torch",
    "torchvision",
]
